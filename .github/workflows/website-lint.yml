name: Website Lint

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'websites/wpgraphql.com/**'
      - '.github/workflows/website-lint.yml'
      - 'package.json'
      - 'package-lock.json'
  # No `paths` filter on pull_request: the `Website Lint` status-check job is a
  # required check, so it must report on every PR. Change detection happens in
  # the detect-changes job below; PRs without website changes skip the lint job
  # and the status check passes.
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch:

# Cancel previous workflow run groups that have not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      wpgraphql-com: ${{ steps.filter.outputs.wpgraphql-com_any_changed }}
      is-release-pr: ${{ steps.check-release-pr.outputs.is-release-pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if release-please PR
        id: check-release-pr
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "$HEAD_REF" =~ ^release-please-- ]]; then
            echo "is-release-pr=true" >> $GITHUB_OUTPUT
            echo "🔔 Detected Release PR - will lint all websites"
          else
            echo "is-release-pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed files
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            wpgraphql-com:
              - websites/wpgraphql.com/**
              - .github/workflows/website-lint.yml
              - package.json
              - package-lock.json

      - name: Log detected changes
        run: |
          echo "wpgraphql.com changed: ${{ steps.filter.outputs.wpgraphql-com_any_changed }}"
          echo "is-release-pr: ${{ steps.check-release-pr.outputs.is-release-pr }}"

  wpgraphql-com:
    name: 'Lint: wpgraphql.com'
    needs: detect-changes
    # Run if: website has changes OR it's a release-please PR OR manual dispatch
    if: |
      (needs.detect-changes.outputs.wpgraphql-com == 'true' ||
       needs.detect-changes.outputs.is-release-pr == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci

      - name: Check formatting (Prettier)
        run: npm run test:format -w @wpgraphql/wpgraphql-com

      - name: Lint (ESLint)
        run: npm run test:lint -w @wpgraphql/wpgraphql-com

  status-check:
    name: 'Website Lint'
    runs-on: ubuntu-latest
    needs: [detect-changes, wpgraphql-com]
    if: always() # Run even if previous jobs were skipped
    steps:
      - name: Check website lint results
        run: |
          # Allowlist the outcomes that mean success. Anything else (failure,
          # cancelled, or a broken detect-changes job) must fail this required
          # check rather than silently passing.
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "❌ Change detection did not succeed (${{ needs.detect-changes.result }})"
            exit 1
          fi
          case "${{ needs.wpgraphql-com.result }}" in
            success)
              echo "✅ wpgraphql.com lint passed"
              ;;
            skipped)
              echo "ℹ️ wpgraphql.com lint skipped (no changes detected)"
              ;;
            *)
              echo "❌ wpgraphql.com lint did not succeed (${{ needs.wpgraphql-com.result }})"
              exit 1
              ;;
          esac
