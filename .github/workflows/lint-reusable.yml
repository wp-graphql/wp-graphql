name: Reusable Lint

on:
  workflow_call:
    inputs:
      plugin_path:
        description: 'Path to the plugin directory (e.g., plugins/wp-graphql)'
        required: true
        type: string
      plugin_name:
        description: 'Name of the plugin (e.g., wp-graphql)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs the PHP coding standards checks.
  #
  # Violations are reported inline with annotations.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP.
  # - Configures caching for PHPCS scans.
  # - Installs Composer dependencies.
  # - Runs PHPCS on the full codebase.
  # - Generate a report for displaying issues as pull request annotations.
  phpcs:
    name: PHP Coding Standards (${{ inputs.plugin_name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.plugin_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      # This date is used to ensure that the PHPCS cache is cleared at least once every week.
      # http://man7.org/linux/man-pages/man1/date.1.html
      - name: "Get last Monday's date"
        id: get-date
        run: echo "date=$(/bin/date -u --date='last Mon' "+%F")" >> "$GITHUB_OUTPUT"

      - name: Cache PHPCS scan cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.3
        with:
          # `actions/cache` resolves a relative path against the repository
          # root, not this job's working-directory, so the path must be
          # explicit. The filename must match the `cache` arg in
          # phpcs.xml.dist (tests/_output/cache.json), or nothing is stored.
          path: ${{ inputs.plugin_path }}/tests/_output/cache.json
          # Handle both phpcs.xml.dist and .phpcs.xml.dist naming conventions
          key: ${{ runner.os }}-date-${{ steps.get-date.outputs.date }}-phpcs-cache-${{ hashFiles(format('{0}/**/composer.json', inputs.plugin_path), format('{0}/phpcs.xml.dist', inputs.plugin_path), format('{0}/.phpcs.xml.dist', inputs.plugin_path), 'phpcs/WPGraphQL/PHPCS/**') }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v3.1.1
        with:
          working-directory: ${{ inputs.plugin_path }}

      - name: Create tests output directory
        run: mkdir -p tests/_output

      - name: Run PHPCS
        id: phpcs
        run: composer check-cs -- --report-full --report-checkstyle=./tests/_output/phpcs-report.xml

      - name: Show PHPCS results in PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./tests/_output/phpcs-report.xml

  # Runs PHP static analysis tests.
  #
  # Violations are reported inline with annotations.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP.
  # - Configures caching for PHP static analysis scans.
  # - Installs Composer dependencies.
  # - Makes Composer packages available globally.
  # - Runs PHPStan static analysis (with Pull Request annotations).
  # - Saves the PHPStan result cache.
  phpstan:
    name: PHP static analysis (${{ inputs.plugin_name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.plugin_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      # This date is used to ensure that the PHPStan result cache is cleared at least once every week.
      # http://man7.org/linux/man-pages/man1/date.1.html
      - name: "Get last Monday's date"
        id: get-date
        run: echo "date=$(/bin/date -u --date='last Mon' "+%F")" >> "$GITHUB_OUTPUT"

      - name: Cache PHP Static Analysis scan cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.3
        with:
          path: ${{ inputs.plugin_path }}/tests/_output # Holds tmpDir (tests/_output/phpstan) from each plugin's phpstan.neon.dist.
          key: 'phpstan-result-cache-${{ inputs.plugin_name }}-${{ runner.os }}-date-${{ steps.get-date.outputs.date }}'
          restore-keys: |
            phpstan-result-cache-${{ inputs.plugin_name }}-${{ runner.os }}-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v3.1.1
        with:
          working-directory: ${{ inputs.plugin_path }}

      - name: Create tests output directory
        run: mkdir -p tests/_output

      - name: Make Composer packages available globally
        run: echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

      - name: Run PHP static analysis tests
        id: phpstan
        run: phpstan analyse -vvv --memory-limit=2G --error-format=checkstyle | cs2pr

      - name: Save result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.3
        if: ${{ !cancelled() }}
        with:
          path: ${{ inputs.plugin_path }}/tests/_output
          key: 'phpstan-result-cache-${{ inputs.plugin_name }}-${{ runner.os }}-date-${{ steps.get-date.outputs.date }}'

  # Runs JavaScript linting checks.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up Node.js.
  # - Installs NPM dependencies.
  # - Runs ESLint on JavaScript files.
  # - Only runs if the plugin has JavaScript source files.
  lintjs:
    name: JavaScript Lint (${{ inputs.plugin_name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci

      - name: Check if lint:js script exists
        id: check-script
        working-directory: ${{ inputs.plugin_path }}
        run: |
          if grep -q '"lint:js"' package.json; then
            echo "has_js_lint=true" >> $GITHUB_OUTPUT
          else
            echo "has_js_lint=false" >> $GITHUB_OUTPUT
          fi

      - name: Run JavaScript linting
        if: steps.check-script.outputs.has_js_lint == 'true'
        working-directory: ${{ inputs.plugin_path }}
        run: npm run lint:js
