name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip on forks: publish_results and code-scanning uploads only work on the
    # upstream repo, so scheduled runs on forks would fail noisily.
    if: github.repository == 'wp-graphql/wp-graphql'
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # A fine-grained PAT (repo administration: read) lets Scorecard read
          # branch-protection rules, which the default GITHUB_TOKEN cannot. When
          # the SCORECARD_TOKEN secret is unset this falls back to GITHUB_TOKEN,
          # so the workflow keeps running (Branch-Protection just stays
          # unscored). See:
          # https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
