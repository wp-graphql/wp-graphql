name: JS Unit Tests

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/*
  workflow_dispatch:

# Cancel previous workflow run groups that have not completed.
concurrency:
  # Group workflow runs by workflow name, along with the head branch ref of the pull request
  # or otherwise the branch or tag ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================
  # CHANGE DETECTION
  # ===========================================
  # Detects which plugins have JavaScript changes to determine which unit test suites to run.
  # Each plugin job depends on this and only runs if its files changed.
  # Release-please PRs (branches starting with "release-please--") will run all tests.
  #
  # The core wp-graphql plugin's legacy bundled GraphiQL also has jest tests
  # (packages/wpgraphiql/**), but that IDE is being retired in favor of the
  # standalone wp-graphql-ide plugin, so its suite intentionally isn't run here.
  # ===========================================

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      wp-graphql-ide: ${{ steps.filter.outputs.wp-graphql-ide_any_changed }}
      # Add outputs for additional plugins here:
      is-release-pr: ${{ steps.check-release-pr.outputs.is-release-pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if release-please PR
        id: check-release-pr
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "$HEAD_REF" =~ ^release-please-- ]]; then
            echo "is-release-pr=true" >> $GITHUB_OUTPUT
            echo "🔔 Detected Release PR - will run unit tests for all plugins with unit tests"
          else
            echo "is-release-pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed files
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            wp-graphql-ide:
              - .github/workflows/js-unit-tests.yml
              - plugins/wp-graphql-ide/src/**
              - plugins/wp-graphql-ide/plugins/**
              - plugins/wp-graphql-ide/tests/unit/**
              - plugins/wp-graphql-ide/package.json
              - package.json
              - package-lock.json
            # Add additional plugins here following the same pattern.

      - name: Log detected changes
        run: |
          echo "wp-graphql-ide changed: ${{ steps.filter.outputs.wp-graphql-ide_any_changed }}"
          echo "is-release-pr: ${{ steps.check-release-pr.outputs.is-release-pr }}"

  # ===========================================
  # WP GRAPHQL IDE
  # ===========================================
  # Runs the WPGraphQL IDE plugin's jest suite (tests/unit/specs/**).
  # Pure jest against source via babel-jest: no build step, no wp-env.
  # ===========================================

  wp-graphql-ide:
    name: 'Unit: wp-graphql-ide'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    needs: detect-changes
    # Run if: plugin has changes OR it's a release-please PR OR manual dispatch
    if: |
      (needs.detect-changes.outputs.wp-graphql-ide == 'true' ||
       needs.detect-changes.outputs.is-release-pr == 'true' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci

      - name: Run jest unit tests
        run: npm run -w @wpgraphql/wp-graphql-ide test:unit

  # ===========================================
  # FINAL STATUS CHECK
  # ===========================================
  # This job always runs and provides a consistent status check name
  # for GitHub branch protection rules. It depends on all conditional
  # unit test jobs and only fails if required jobs failed (not if they were skipped).
  # ===========================================

  status-check:
    name: 'JS Unit Tests'
    runs-on: ubuntu-latest
    needs: [detect-changes, wp-graphql-ide]
    if: always() # Run even if previous jobs were skipped
    steps:
      - name: Check JS unit test results
        run: |
          # Check if any required jobs failed (excluding skipped)
          if [ "${{ needs.wp-graphql-ide.result }}" == "failure" ]; then
            echo "❌ wp-graphql-ide JS unit tests failed"
            exit 1
          fi
          # Allow skipped jobs (expected when files don't change)
          if [ "${{ needs.wp-graphql-ide.result }}" == "skipped" ]; then
            echo "ℹ️ wp-graphql-ide JS unit tests skipped (no changes detected)"
          fi
          echo "✅ All required JS unit tests passed"

  # ===========================================
  # ADDITIONAL PLUGINS
  # ===========================================
  # To add jest unit tests for another plugin:
  # 1. Add plugin to change detection outputs and files_yaml above
  # 2. Add a job below following the wp-graphql-ide pattern
  # 3. Ensure plugin has a test:unit script in package.json
  # 4. Add the plugin job to status-check needs array above
  # ===========================================
