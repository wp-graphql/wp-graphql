version: 2

updates:
  # Composer: wp-graphql plugin.
  - package-ecosystem: 'composer'
    directory: '/plugins/wp-graphql'
    schedule:
      interval: 'weekly'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: 'fix'
      prefix-development: 'fix'
      include: 'scope'
    groups:
      # We don't bundle minor or major production assets, so they're tested individually.
      wp-graphql-composer-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      wp-graphql-composer-patch:
        dependency-type: 'production'
        update-types: [patch]

  #  Composer: wp-graphql-acf plugin.
  - package-ecosystem: 'composer'
    directory: '/plugins/wp-graphql-acf'
    schedule:
      interval: 'weekly'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: 'fix'
      prefix-development: 'fix'
      include: 'scope'
    groups:
      # We don't bundle minor or major production assets, so they're tested individually.
      wp-graphql-acf-composer-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      wp-graphql-acf-composer-patch:
        dependency-type: 'production'
        update-types: [patch]

  #  Composer: wp-graphql-ide plugin.
  - package-ecosystem: 'composer'
    directory: '/plugins/wp-graphql-ide'
    schedule:
      interval: 'weekly'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: 'fix'
      prefix-development: 'fix'
      include: 'scope'
    groups:
      # We don't bundle minor or major production assets, so they're tested individually.
      wp-graphql-ide-composer-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      wp-graphql-ide-composer-patch:
        dependency-type: 'production'
        update-types: [patch]

  # Composer: wp-graphql-smart-cache plugin.
  - package-ecosystem: 'composer'
    directory: '/plugins/wp-graphql-smart-cache'
    schedule:
      interval: 'weekly'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: 'fix'
      prefix-development: 'fix'
      include: 'scope'
    groups:
      # We don't bundle minor or major production assets, so they're tested individually.
      wp-graphql-smart-cache-composer-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      wp-graphql-smart-cache-composer-patch:
        dependency-type: 'production'
        update-types: [patch]

  # NPM Dependencies.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: 'increase'
    commit-message:
      prefix: 'feat'
      prefix-development: 'fix'
      include: 'scope'
    ignore:
      # The GraphiQL IDE bundled in core wp-graphql is being deprecated in favor
      # of the standalone wp-graphql-ide plugin, so we don't want to invest in
      # upgrading its dependency tree. Ignore graphiql (and the query-param
      # helpers it pulls in) entirely rather than churn on updates we won't ship.
      - dependency-name: 'graphiql'
      - dependency-name: 'use-query-params'
      - dependency-name: 'query-string'
      # graphql v17 is a coordinated migration we'll do deliberately, after the
      # legacy bundled GraphiQL is retired: graphiql 1.x and @apollo/client 3.x
      # peer-depend on graphql ^15 || ^16, so an isolated major bump ships two
      # graphql copies in the bundles and type checks fail silently across
      # them. The v16 behaviors we rely on are pinned by canary tests (see
      # tests named graphql-v16-canary in wp-graphql and wp-graphql-ide);
      # minor/patch updates within v16 still flow normally.
      - dependency-name: 'graphql'
        update-types: ['version-update:semver-major']
      # eslint v10 requires @typescript-eslint v8+ across the whole install,
      # but npm hoists @typescript-eslint v6 to the monorepo root via
      # @wordpress/scripts in the plugin workspaces, and eslint 10 crashes
      # loading its scope-manager (scopeManager.addGlobals is not a
      # function). The wpgraphql.com workspace pins eslint ^9 (see the
      # header of its eslint.config.js). Drop this ignore when
      # @wordpress/scripts ships a typescript-eslint v8+ tree.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      npm-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      npm-prod-minor-patch:
        dependency-type: 'production'
        update-types: [minor, patch]

  # GitHub Actions: 1x weekly. No release triggered (chore).
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions-updates:
        patterns: ['*']
